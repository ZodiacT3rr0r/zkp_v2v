[package]
name    = "zkp_v2v"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zkp_cli"
path = "src/bin/zkp_cli.rs"

[dependencies]
num-bigint    = { version = "0.4", features = ["rand"] }
num-traits    = "0.2"
num-integer   = "0.1"
sha2          = "0.10"
rand          = { version = "0.8", features = ["getrandom"] }
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
clap          = { version = "4.0", features = ["derive"] }
rusqlite      = { version = "0.31", features = ["bundled"] }
hex           = "0.4"
ark-circom    = { version = "0.6", default-features = false }
ark-groth16   = "0.6"
ark-bn254     = "0.6"
ark-serialize = "0.6"
ark-std       = "0.6"

[dev-dependencies]
proptest = "1.0"
